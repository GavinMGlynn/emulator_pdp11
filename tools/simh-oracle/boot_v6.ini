; SimH reference boot of Unix V6 on the 11/70 (P7 oracle).
;
; Image: unix0_v6_rk.dsk — the bootable V6 root, extracted from
;   roms/pdp-11.org.ru/files/unix/uv6swre.zip  (unix0_v6_rk.dsk).
; It must be WRITABLE (V6 mounts root read-write and updates the superblock at
; boot; a read-only attach hangs the kernel), so work on a copy:
;   unzip -j -o roms/pdp-11.org.ru/files/unix/uv6swre.zip unix0_v6_rk.dsk -d images/
;   cp images/unix0_v6_rk.dsk images/u0rw.dsk
;
; Boot dialog: the block-0 bootstrap prints "@"; type the kernel name "unix".
; The kernel comes up multi-user at "login:"; log in as "root" (no password) to
; get the "# " single-character root shell. Then ordinary commands run.
;
; Run:  ext/simh/BIN/pdp11 tools/simh-oracle/boot_v6.ini
;
; This is the console-stream reference our headless frontend's boot must match
; (P7); the transcript below (echo + ls /) is the golden target.

set cpu 11/70
set cpu 256k
attach rk0 images/u0rw.dsk
expect "@" send "unix\r"; go
expect "login: " send "root\r"; go
expect "# " send "echo HELLO_FROM_V6\rls /\r"; go
boot rk0
